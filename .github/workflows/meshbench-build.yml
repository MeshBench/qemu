name: meshbench build

# A six-minute check that this fork still builds and still carries its radio.
# One target, one platform, and no release: build.yml is the only workflow
# here that publishes, because it is the only one that produces the full
# matrix under the names MeshBench's packaging matches on.
#
# The release step this workflow used to end with is gone, and that is the
# whole point of the file's current shape. It wrote a tag carrying a single
# qemu-meshbench-linux-x86_64.tar.gz; being the newest release that became
# *latest*, and MeshBench fetches the Xtensa Linux, Windows and macOS archives
# from latest by pattern. None of the three matched, every fetch is a warning
# rather than a failure, and all three platforms' bundles shipped without an
# emulator while every build stayed green. Publish by tagging a v* and letting
# build.yml do it.
#
# Only the Xtensa target here: this fork exists to run ESP32 firmware against a
# simulated radio, and building the other forty architectures would turn a six
# minute job into an hour for nothing.

on:
  push:
    # meshbench-sx1262 was the working branch and meshbench-main is the default
    # branch it became; naming the old one meant this stopped running on pushes
    # without anybody noticing it had.
    branches: [meshbench-main]
  workflow_dispatch:

# Read-only, deliberately. Every write this repository has any business making
# from CI is a release, and releases come from build.yml on a v* tag.
permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - name: Dependencies
        run: |
          sudo apt-get update
          # libgcrypt is the one that matters. The esp32 machine references an
          # RSA device that is gated on gcrypt, so a build without it fails at
          # machine instantiation with "unknown type 'misc.esp32.rsa'" - long
          # after the build succeeded, and nowhere near the cause.
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config python3-venv \
            libglib2.0-dev libpixman-1-dev libgcrypt20-dev libslirp-dev

      - name: Configure
        run: |
          ./configure \
            --target-list=xtensa-softmmu \
            --disable-werror \
            --enable-slirp \
            --enable-gcrypt \
            --prefix=/usr

      - name: Build
        run: ninja -C build -j"$(nproc)"

      - name: Confirm this is our fork and not upstream
        run: |
          set -e
          # The device only exists on this branch. Its absence means a checkout
          # or a submodule quietly resolved to upstream, which would produce a
          # QEMU that runs and reports no chip present - a wiring fault dressed
          # as a hardware one.
          test -f hw/ssi/sx1262.c || { echo "sx1262 device missing" >&2; exit 1; }
          ./build/qemu-system-xtensa -machine help | grep -qi esp32
          echo "sx1262 device present, esp32 machine available"

      - name: Package
        run: |
          set -e
          mkdir -p dist/qemu-meshbench/bin dist/qemu-meshbench/share
          cp build/qemu-system-xtensa dist/qemu-meshbench/bin/
          # QEMU resolves its own path to find these, which is why a bare copy
          # of the binary does not run and a symlink does.
          cp -r pc-bios dist/qemu-meshbench/share/qemu 2>/dev/null || \
            cp -r build/pc-bios dist/qemu-meshbench/share/qemu
          tar czf dist/qemu-meshbench-linux-x86_64.tar.gz -C dist qemu-meshbench
          ls -la dist/*.tar.gz

      # An artifact, never a release asset. It is here to be downloaded by
      # somebody debugging this branch, and it is deliberately named nothing
      # like the archives build.yml publishes: qemu-meshbench-linux-x86_64
      # matches none of MeshBench's fetch patterns, and an asset by that name
      # on a release is exactly how three platforms came to ship without an
      # emulator.
      - uses: actions/upload-artifact@v4
        with:
          name: qemu-meshbench-linux
          path: dist/*.tar.gz
          retention-days: 7

  # macOS and Windows are not skipped rows here any more: build.yml builds
  # both, Windows cross-compiled on a Linux runner, and this file is the quick
  # single-platform check rather than a matrix with two thirds of it disabled.
