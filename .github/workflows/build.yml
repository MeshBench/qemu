name: 'build'

# push and workflow_dispatch only - pull_request is deliberately gone. The
# macOS legs run on the org's own Mac now, and a fork pull request runs the
# PR's version of this file, which could point any job at that machine. Push
# and dispatch need write access; nobody outside can cause either.
on:
  push:
  workflow_dispatch:

jobs:

  Vars:
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.Vars.outputs.VERSION }}
      PROJECT_NAME: ${{ steps.Vars.outputs.PROJECT_NAME }}
      REPOSITORY_URL: ${{ steps.Vars.outputs.REPOSITORY_URL }}
    steps:
      - id: Vars
        run: |
          echo "ref_type: ${{ github.ref_type }}"
          echo "ref: ${{ github.ref }}"
          echo "sha: ${{ github.sha }}"
          echo ""
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            VERSION=${{ github.ref }}
            VERSION=${VERSION#"refs/tags/"}
            VERSION=${VERSION//"-"/"_"}   # replace dashes with underscores in the version
          else
            VERSION=${{ github.sha }}
            VERSION=g${VERSION:0:8}
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"
          echo $VERSION

          OWNER=${{ github.repository_owner }}
          FULLNAME=${{ github.repository }}
          PROJECT_NAME=${FULLNAME#"$OWNER/"}
          echo "PROJECT_NAME=$PROJECT_NAME" >> "$GITHUB_OUTPUT"
          echo $PROJECT_NAME

          REPOSITORY_URL=${{ github.server_url }}/${{ github.repository }}
          echo "REPOSITORY_URL=$REPOSITORY_URL" >> "$GITHUB_OUTPUT"
          echo $REPOSITORY_URL

  Build:
    needs: [ Vars ]
    env:
      # A simple way to spread several environments for Windows. But to be more precise, we need to somehow add different envs to matrix.include

      MSYSTEM: MINGW64  # Ref: https://www.msys2.org/docs/environments/
      CHERE_INVOKING: 'yes'
      MSYS: 'winsymlinks:native'
    strategy:
      fail-fast: false
      matrix:
        # Naming MinGW platforms: https://sourceforge.net/p/mingw-w64/wiki2/TypeTriplets/
        platform:
          - x86_64-linux-gnu
          - aarch64-linux-gnu
          - x86_64-w64-mingw32
          # x86_64-apple-darwin is deliberately absent: the only Mac is an
          # arm64 one, and Rosetta cross-building x86_64 QEMU is not worth
          # the runner's time until somebody on an Intel Mac asks.
          - aarch64-apple-darwin
        target: [xtensa-softmmu, riscv32-softmmu]

        include:
          - platform: x86_64-linux-gnu
            runs_on: ubuntu-22.04
            # Debian 11 provides the lowest possible Glibc version (2.31), given QEMU's glib2 => 2.66 requirement.
            container: debian:11.11
            shell: bash -e {0}
            run_prerequisites: "./.github/workflows/scripts/prerequisites-native.sh"
            run_configure: "./.github/workflows/scripts/configure-native.sh"

          - platform: aarch64-linux-gnu
            runs_on: ubuntu-22.04
            # Debian 11 provides the lowest possible Glibc version (2.31), given QEMU's glib2 => 2.66 requirement.
            container: debian:11.11
            shell: bash -e {0}
            run_prerequisites: "./.github/workflows/scripts/prerequisites-cross-linux-arm64.sh"
            run_configure: "./.github/workflows/scripts/configure-cross-linux-arm64.sh"

          - platform: x86_64-w64-mingw32
            runs_on: windows-2022
            shell: msys2 {0}
            run_configure: "./.github/workflows/scripts/configure-win.sh"

          - platform: x86_64-apple-darwin
            runs_on: macos-14
            shell: bash -e {0}
            run_prerequisites: "./.github/workflows/scripts/prerequisites-macos.sh"
            run_configure: "./.github/workflows/scripts/configure-macos.sh"

          - platform: aarch64-apple-darwin
            # The org's own M4: faster than hosted, no queue. Safe because
            # every event that reaches this workflow needs write access.
            runs_on: [self-hosted, macos-m4]
            shell: bash -e {0}
            run_prerequisites: "./.github/workflows/scripts/prerequisites-macos.sh"
            run_configure: "./.github/workflows/scripts/configure-macos.sh"

    runs-on: ${{ matrix.runs_on }}
    container:
        image: ${{ matrix.container }}
    defaults:
      run:
        shell: ${{ matrix.shell }}

    steps:
      - uses: actions/checkout@v6

      - name: Install prerequisites (${{ matrix.target }} @ ${{ matrix.platform }})
        if : ${{ matrix.platform != 'x86_64-w64-mingw32' }}
        run: |
          ${{ matrix.run_prerequisites }}

      - name: Install MSYS2 prerequisites (${{ matrix.target }} @ ${{ matrix.platform }})
        if : ${{ matrix.platform == 'x86_64-w64-mingw32' }}
        uses: msys2/setup-msys2@v2
        with:
          cache: true
          msystem: MINGW64
          install: >-
            diffutils
            git
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-libgcrypt
            mingw-w64-x86_64-libiconv
            mingw-w64-x86_64-libslirp
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pixman
            mingw-w64-x86_64-pkg-config
            mingw-w64-x86_64-python
            mingw-w64-x86_64-SDL2

      - name: Configure (${{ matrix.target }} @ ${{ matrix.platform }})
        env:
          VERSION: ${{ needs.Vars.outputs.VERSION }}
          TARGET: ${{ matrix.target }}
        run: |
          ${{ matrix.run_configure }}

      - name: Build (${{ matrix.target }} @ ${{ matrix.platform }})
        run: |
          ninja -C build install

      - name: Bundle Windows DLLs (${{ matrix.target }} @ ${{ matrix.platform }})
        if : ${{ matrix.platform == 'x86_64-w64-mingw32' }}
        run: |
          ./.github/workflows/scripts/bundle-win-dlls.sh install/qemu/bin

      - name: Package (${{ matrix.target }} @ ${{ matrix.platform }})
        env:
          VERSION: ${{ needs.Vars.outputs.VERSION }}
          PROJECT_NAME: ${{ needs.Vars.outputs.PROJECT_NAME }}
          PLATFORM: ${{ matrix.platform }}
          TARGET: ${{ matrix.target }}
        run: |
          # Carry the libraries QEMU needs, so the archive runs on a machine
          # that has never built anything. Without this the binary starts and
          # dies on libslirp/libpixman/libgcrypt - which for somebody who just
          # downloaded MeshBench is indistinguishable from MeshBench being
          # broken. glibc and its siblings are deliberately not copied: they
          # are the one thing every Linux has, and shipping them fights the
          # host loader.
          #
          # Native x86_64 only. The aarch64 legs cross-compile, so the host's
          # ldd cannot resolve the guest's libraries; that archive still
          # expects its distro to provide them.
          if [ "$PLATFORM" = "x86_64-linux-gnu" ]; then
            # No patchelf and no sudo: neither exists in the build container,
            # and configure has set -rpath=$ORIGIN/../lib at link time. All that
            # is left is putting the libraries where that points.
            mkdir -p install/qemu/lib
            for so in $(ldd install/qemu/bin/qemu-system-* | awk '/=> \//{print $3}' | sort -u); do
              case "$(basename "$so")" in
                libc.so.*|libm.so.*|libpthread.so.*|libdl.so.*|librt.so.*|libutil.so.*|ld-linux*) ;;
                *) cp -Lv "$so" install/qemu/lib/ ;;
              esac
            done
            echo "bundled:"; ls -la install/qemu/lib
            readelf -d install/qemu/bin/qemu-system-* | grep -i 'rpath\|runpath' || \
              echo "::warning::no rpath in the binary; it will need system libraries"
          fi
          # macOS: the same problem as Linux, in Apple's dialect. The binary
          # links Homebrew dylibs (/opt/homebrew/opt/pixman, libgcrypt) that
          # exist on the machine that built it and on no user's Mac, so it
          # aborts in dyld before main. Verified on an actual Mac, not
          # assumed.
          #
          # Copy each one in, rewrite the reference to @executable_path, and
          # follow the dylibs' own dependencies - libgcrypt pulls
          # libgpg-error behind it. Then re-sign: install_name_tool
          # invalidates the signature, and an unsigned binary does not run at
          # all on Apple Silicon.
          case "$PLATFORM" in
            *apple-darwin)
              mkdir -p install/qemu/lib
              todo=$(ls install/qemu/bin/qemu-system-*)
              while [ -n "$todo" ]; do
                next=""
                for f in $todo; do
                  for dep in $(otool -L "$f" | tail -n +2 | awk '{print $1}' | grep -E '^/opt/homebrew|^/usr/local'); do
                    base=$(basename "$dep")
                    if [ ! -f "install/qemu/lib/$base" ]; then
                      cp "$dep" "install/qemu/lib/$base"
                      chmod u+w "install/qemu/lib/$base"
                      install_name_tool -id "@executable_path/../lib/$base" "install/qemu/lib/$base"
                      next="$next install/qemu/lib/$base"
                    fi
                    install_name_tool -change "$dep" "@executable_path/../lib/$base" "$f"
                  done
                done
                todo="$next"
              done
              codesign --force --sign - install/qemu/lib/*.dylib install/qemu/bin/qemu-system-* || true
              echo "bundled:"; ls -la install/qemu/lib
              echo "remaining non-system references:"
              otool -L install/qemu/bin/qemu-system-* | grep -E '/opt/homebrew|/usr/local' || echo "  none"
              install/qemu/bin/qemu-system-* --version | head -1
              ;;
          esac
          find $PWD/install/qemu/share/qemu/ -maxdepth 1 -mindepth 1 -not -name 'esp*.bin' -exec rm -rfv {} \;
          export DIST_DIR=${PWD}/dist
          mkdir -p ${DIST_DIR}
          cd $PWD/install
          ARCHIVE_NAME=${PROJECT_NAME}-${TARGET}-${VERSION}-${PLATFORM}.tar.xz
          tar -cJvf ${DIST_DIR}/${ARCHIVE_NAME} qemu > ${DIST_DIR}/dist-filelist-${TARGET}-${PLATFORM}.txt 2>&1
          echo "dist/dist-${PROJECT_NAME}-${TARGET}-${PLATFORM}/${ARCHIVE_NAME}" > ${DIST_DIR}/file_${PLATFORM}_${TARGET}

      - name: Save build/build.ninja for failed builds
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: build-ninja-${{ matrix.target }}-${{ matrix.platform }}
          path: build/build.ninja

      - name: Dist filelist (dbg) (${{ matrix.target }} @ ${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: dist-filelist-${{ matrix.target }}-${{ matrix.platform }}
          path: |
            dist/dist-filelist-*

      - name: Dist artifacts (${{ matrix.target }} @ ${{ matrix.platform }})
        uses: actions/upload-artifact@v7
        with:
          name: dist-qemu-${{ matrix.target }}-${{ matrix.platform }}
          path: |
            dist/

  Upload:
    # always(), because the matrix builds five platforms and a tag should
    # still publish the ones that worked. Windows (mingw) and macOS arm64 do
    # not build in this fork yet; waiting for them would mean never releasing
    # the Linux and macOS x86_64 emulators that do.
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: [ Vars, Build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps :
      - name: Create a source archive
        id: create-source
        env:
          VERSION: ${{ needs.Vars.outputs.VERSION }}
          PROJECT_NAME: ${{ needs.Vars.outputs.PROJECT_NAME }}
          REPOSITORY_URL: ${{ needs.Vars.outputs.REPOSITORY_URL }}
        run: |
          export RELEASE_CHECKSUM_FILE="${PROJECT_NAME}-${VERSION}-checksum.sha256"
          echo "RELEASE_CHECKSUM_FILE=$RELEASE_CHECKSUM_FILE" >> "$GITHUB_OUTPUT"
          RELEASE_SRC_NAME="${PROJECT_NAME}-${VERSION}-src"
          export RELEASE_SRC_FILE="${PROJECT_NAME}-${VERSION}-src.tar.xz"
          echo "RELEASE_SRC_FILE=$RELEASE_SRC_FILE" >> "$GITHUB_OUTPUT"

          rm -rf -- "${RELEASE_SRC_NAME}" "${RELEASE_SRC_FILE}"
          git clone --quiet --depth 1 --recurse-submodules --shallow-submodules "${REPOSITORY_URL}" "${RELEASE_SRC_NAME}"
          find "${RELEASE_SRC_NAME}" -name ".git" -type d -exec rm -rf -- "{}" +
          find "${RELEASE_SRC_NAME}" -name .git\* -exec rm -rf -- {} +
          tar -cJvf "${RELEASE_SRC_FILE}" "${RELEASE_SRC_NAME}" > src-filelist.txt 2>&1
          rm -rf -- "${RELEASE_SRC_NAME}"
          ls -l

      - name: Source filelist (dbg)
        uses: actions/upload-artifact@v7
        with:
          name: src-filelist
          path: |
            src-filelist.txt

      - uses: actions/download-artifact@v8
        with:
          pattern: dist-qemu-*
          path: dist

      - name: Create a checksum file
        env:
          RELEASE_CHECKSUM_FILE: ${{ steps.create-source.outputs.RELEASE_CHECKSUM_FILE }}
          RELEASE_SRC_FILE: ${{ steps.create-source.outputs.RELEASE_SRC_FILE }}
        run: |
          ls -l
          DIST_FILE_LIST=$(find . -name file_\* -exec cat {} \+)
          DIST_FILE_LIST="${DIST_FILE_LIST} ${RELEASE_SRC_FILE}"
          RELEASE_CHECKSUM_FILE=$(realpath "${RELEASE_CHECKSUM_FILE}")
          for n in $DIST_FILE_LIST; do
            # Release archives might be in subdirectories, but we need just the file names in the checksum file
            n_dir=$(dirname "${n}")
            n_file=$(basename "${n}")
            pushd "${n_dir}" > /dev/null
            sz=$(stat -c%s "${n_file}")
            printf "# %s: %s bytes\n" "${n_file}" "${sz}" >> "${RELEASE_CHECKSUM_FILE}"
            sha256sum -b "${n_file}" >> "${RELEASE_CHECKSUM_FILE}"
            popd > /dev/null
          done
          DIST_FILE_LIST="${DIST_FILE_LIST} ${RELEASE_CHECKSUM_FILE}"
          # remove new lines from file list
          DIST_FILE_LIST="${DIST_FILE_LIST//$'\n'/ }"
          cat "${RELEASE_CHECKSUM_FILE}"
          rm -rf -- upload && mkdir -p upload && mv -v ${DIST_FILE_LIST} upload/

      # always() lets a partial matrix publish, which is the point - but a
      # matrix where *nothing* built would otherwise publish a release
      # containing only a source archive, and that release then shadows the
      # last good one for anybody downloading by pattern. Ask for at least
      # one platform archive before releasing anything.
      - name: Refuse to release without the platform MeshBench needs
        run: |
          set -e
          find upload -name '*.tar.xz' -printf '  %f\n' | sort
          # "At least one archive" is not enough. A release with only the
          # macOS builds still becomes *latest*, and MeshBench downloads the
          # Xtensa Linux archive by pattern from whatever latest is - so a
          # partial release silently replaces a working one with a set that
          # does not contain the file anybody fetches. This is the file that
          # makes a release worth publishing.
          if ! find upload -name '*xtensa*x86_64-linux-gnu.tar.xz' | grep -q .; then
            echo "::error::no Xtensa x86_64 Linux archive; not publishing a release that would shadow the last good one"
            exit 1
          fi

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          # Not a draft: MeshBench's packaging downloads these by pattern, and
          # a draft is invisible to that. The tag says which fork and which
          # change it carries.
          draft: false
          files: upload/*
